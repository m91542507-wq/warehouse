<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Учёт склада</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div id="auth" class="auth hidden">
  <div class="card">
    <h1>📦 Учёт склада</h1>
    <div class="tabs2">
      <button id="tabLogin" class="active" onclick="authMode('login')">Вход</button>
      <button id="tabReg" onclick="authMode('reg')">Регистрация</button>
    </div>
    <form id="authForm">
      <label>Логин <input id="aLogin" required autocomplete="username"></label>
      <label>Пароль <input id="aPass" type="password" required minlength="4" autocomplete="current-password"></label>
      <label id="aNameWrap" class="hidden">Имя <input id="aName"></label>
      <button class="primary" type="submit">Войти</button>
      <p id="aErr" class="err"></p>
    </form>
    <p class="hint">Первый вход: <b>admin</b> / <b>admin123</b></p>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <b>📦 Учёт склада</b>
    <nav id="nav"></nav>
    <span class="who"><span id="whoami"></span> <button onclick="logout()">Выйти</button></span>
  </header>
  <div id="alerts"></div>
  <main id="view"></main>
</div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast"></div>

<script src="app.js"></script>
</body>
</html>
